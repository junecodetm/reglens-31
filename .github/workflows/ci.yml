name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python scripts/check_zero_cost.py
      # Replay guard: the published static data must be exactly re-derivable
      # from the committed snapshots (DETERMINISTIC-REPLAY invariant); any
      # hand-edit to web/public/data/ fails here.
      - name: export-replay-guard
        run: |
          uv run python -m reglens.store.export_web
          git diff --exit-code web/public/data
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # Non-affiliation invariant (CLAUDE.md §2, invariant 4): the disclaimer
      # must be present in the README and on EVERY emitted page of the
      # multi-page static build; the mockup framing stays pinned to the
      # Overview page. Any miss fails the push.
      - name: disclaimer-and-framing-guard
        run: |
          grep -qF "not affiliated with, endorsed by, or an official product of the U.S. Department of the Treasury" README.md
          pages=$(find web/out -name index.html)
          test -n "$pages"
          for page in $pages; do
            grep -qF "Not affiliated with, endorsed by, or representing the U.S. Department of the Treasury" "$page" \
              || { echo "disclaimer missing: $page"; exit 1; }
          done
          grep -qF "About this demonstration" web/out/index.html
          grep -qF "Regulatory Reform Tool" web/out/index.html
