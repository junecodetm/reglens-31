name: deploy-pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  verify:
    # Deploys must never publish a build that fails the fast checks or the eval gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python -m reglens.eval.harness --gate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      # Build BEFORE test: routes-contract reads the emitted web/out pages.
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
      # Non-affiliation invariant (CLAUDE.md §2, invariant 4): never deploy a
      # build with ANY page missing the disclaimer, or / missing the framing.
      # Mirrors ci.yml — deploy does not depend on the ci workflow, so the
      # guard must hold here independently.
      - name: disclaimer-and-framing-guard
        run: |
          test "$(find web/out -name index.html | wc -l)" -gt 0
          find web/out -name index.html -print0 | while IFS= read -r -d '' page; do
            grep -qF "Not affiliated with, endorsed by, or representing the U.S. Department of the Treasury" "$page" \
              || { echo "disclaimer missing: $page"; exit 1; }
          done
          grep -qF "About this demonstration" web/out/index.html
          grep -qF "Regulatory Reform Tool" web/out/index.html
      # The artifact carries the static site AND the Pages Function source:
      # wrangler bundles a `functions/` directory found in the working
      # directory of the deploy command.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: |
            web/out
            functions
          if-no-files-found: error

  deploy:
    # Isolation: the job holding the Cloudflare token runs NO package install
    # or build step — it only downloads the verified artifact and publishes it
    # (the SHA-pinned wrangler-action is the sole tool it runs).
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
      # The live-drafting key is a Pages project secret, bound server-side
      # only — it never exists in the static bundle. Idempotent per deploy;
      # an empty value is harmless (the function answers 503 + fallback).
      - name: write-groq-secret-manifest
        run: printf '{"GROQ_API_KEY": "%s"}\n' "$GROQ_API_KEY" > groq-secret.json
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b94d03381eaf097c86c43ffac8939735
          command: pages secret bulk groq-secret.json --project-name=reglens-31
      - name: remove-groq-secret-manifest
        if: always()
        run: rm -f groq-secret.json
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b94d03381eaf097c86c43ffac8939735
          command: pages deploy web/out --project-name=reglens-31 --branch=main
