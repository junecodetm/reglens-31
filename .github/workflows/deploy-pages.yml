name: deploy-pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  verify:
    # Deploys must never publish a build that fails the fast checks or the eval gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python -m reglens.eval.harness --gate

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # Non-affiliation invariant (CLAUDE.md §2, invariant 4): never deploy a
      # build that lost the disclaimer or the mockup framing.
      - name: disclaimer-and-framing-guard
        run: |
          grep -qF "Not affiliated with, endorsed by, or representing the U.S. Department of the Treasury" web/out/index.html
          grep -qF "About this demonstration" web/out/index.html
          grep -qF "Regulatory Reform Tool" web/out/index.html
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b94d03381eaf097c86c43ffac8939735
          command: pages deploy web/out --project-name=reglens-31 --branch=main
