name: eval

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Committed fixtures only: no model, no API key, $0.
      - run: uv run python -m reglens.eval.harness --gate
      - run: uv run python -m reglens.eval.ogc01 --gate
